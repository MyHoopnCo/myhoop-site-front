<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myhoop. Player Profile</title>
 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/nav-auth.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
  <link rel="stylesheet" href="css/components/registration.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
  <link rel="stylesheet" href="css/pages/player-profile.css" />
 
  <link rel="icon" type="image/png" sizes="32x32" href="images/global/Logo_NoWords.png">
</head>
 
<body>
 
  <div id="navbar-container"></div>
 
  <section class="profile-section">
    <div class="profile-wrapper" id="profile-wrapper">
      <!-- populated by js/player-profile.js -->
    </div>
  </section>

  <!-- "Edit profile" modal — only ever opened when viewing your own profile -->
  <div class="reg-overlay" id="account-overlay">
    <div class="reg-box" id="account-box"></div>
  </div>
 
  <div id="footer-container"></div>
 
  <script src="js/components/footer.js"></script>
  <script src="js/components/navbar.js"></script>
  <script type="module" src="js/components/nav-auth.js"></script>
  <script type="module" src="js/player-profile.js"></script>
 
</body>
</html>
